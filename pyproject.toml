[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Distribution name keeps the brand; the importable package is `eightypwner`
# because Python identifiers cannot start with a digit.
[project]
name = "80pwner"
version = "0.1.0"
description = "80PWNER — An Integrated GUI Pwn / Binary Analysis Workbench"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anas Mahfouz (The80)" }]
keywords = ["ctf", "pwn", "binary", "reverse-engineering", "gdb", "gui"]

dependencies = [
    "PySide6>=6.6",
    # Engine backends are imported lazily; install the [analysis] extra for
    # full functionality (Steps 2-9 of the delivery plan).
]

[project.optional-dependencies]
analysis = [
    "pwntools>=4.11",
    "capstone>=5.0",
    "lief>=0.13",
    "pygdbmi>=0.11",
    "keystone-engine>=0.11",
    "pyelftools>=0.30",
]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.5",
    "pre-commit>=3.7",
]

[project.scripts]
80pwner = "eightypwner.cli:main"

# Third-party plugin hooks: any installed distribution may expose
# ``80pwner.plugins`` entry points pointing at Plugin subclasses.
[project.entry-points."80pwner.plugins"]

[project.urls]
Homepage = "https://github.com/the80/80pwner"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eightypwner = ["assets/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # long lines allowed in QSS/ASCII art constants

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
qt_api = "pyside6"
